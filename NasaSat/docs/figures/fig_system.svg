<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="'Leelawadee UI', Tahoma, sans-serif" font-size="12">
  <title>ภาพรวมระบบย่อยและลูปควบคุมของ NasaSat</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #888; stroke-width: 1.2; }
    .t { fill: #222; }
    .s { fill: #555; font-size: 10.5px; }
    .tag { font-size: 9.5px; fill: #fff; font-weight: bold; }
    .ln { stroke: #555; stroke-width: 1.4; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <rect x="0" y="0" width="680" height="330" fill="#fafafa"/>
  <text x="14" y="22" class="t" font-weight="bold" font-size="13">ลูปภารกิจ 1 (Sun Tracking)</text>

  <!-- row 1: control loop -->
  <g>
    <rect class="box" x="14" y="40" width="92" height="62" rx="8"/>
    <circle cx="36" cy="62" r="9" fill="#f5c542"/>
    <text x="52" y="66" class="t">หลอดไฟ</text>
    <text x="24" y="90" class="s">แทนดวงอาทิตย์</text>

    <rect class="box" x="126" y="40" width="112" height="62" rx="8"/>
    <rect x="126" y="40" width="44" height="15" rx="4" fill="#3A9BD5"/><text x="131" y="51" class="tag">ADCS</text>
    <text x="134" y="72" class="t">LDR 2 ตัว (ตัว V)</text>
    <text x="134" y="90" class="s">+ กล่องกันแสง</text>

    <rect class="box" x="258" y="40" width="112" height="62" rx="8"/>
    <rect x="258" y="40" width="38" height="15" rx="4" fill="#1E9E7E"/><text x="263" y="51" class="tag">OBC</text>
    <text x="266" y="72" class="t">ADC → มุม θ</text>
    <text x="266" y="90" class="s">G, γ, q, g, LUT</text>

    <rect class="box" x="390" y="40" width="120" height="62" rx="8"/>
    <rect x="390" y="40" width="38" height="15" rx="4" fill="#1E9E7E"/><text x="395" y="51" class="tag">OBC</text>
    <text x="398" y="72" class="t">ตัวควบคุม</text>
    <text x="398" y="90" class="s">วัด → หมุน k·error → รอ</text>

    <rect class="box" x="530" y="40" width="136" height="62" rx="8"/>
    <rect x="530" y="40" width="44" height="15" rx="4" fill="#3A9BD5"/><text x="535" y="51" class="tag">ADCS</text>
    <text x="538" y="72" class="t">stepper 28BYJ-48</text>
    <text x="538" y="90" class="s">ULN2003, 0.088°/step</text>

    <path class="ln" d="M106,71 L124,71"/>
    <path class="ln" d="M238,71 L256,71"/>
    <path class="ln" d="M370,71 L388,71"/>
    <path class="ln" d="M510,71 L528,71"/>
    <path class="ln" d="M598,102 L598,128 L182,128 L182,104"/>
    <text x="300" y="143" class="s">ตัวดาวเทียมหมุน → มุมที่แสงตกบน LDR เปลี่ยน (ปิดลูป)</text>
  </g>

  <text x="14" y="176" class="t" font-weight="bold" font-size="13">ภารกิจ 2 (Target Imaging) และสถานีภาคพื้น</text>
  <!-- row 2 -->
  <g>
    <rect class="box" x="14" y="194" width="130" height="62" rx="8"/>
    <rect x="14" y="194" width="58" height="15" rx="4" fill="#C07F00"/><text x="19" y="205" class="tag">Payload</text>
    <text x="22" y="226" class="t">กล้อง OV2640</text>
    <text x="22" y="244" class="s">JPEG, ล็อกแสงได้</text>

    <rect class="box" x="166" y="194" width="170" height="62" rx="8"/>
    <rect x="166" y="194" width="50" height="15" rx="4" fill="#C45E99"/><text x="171" y="205" class="tag">COMM</text>
    <text x="174" y="226" class="t">USB Serial แบบบรรทัด</text>
    <text x="174" y="244" class="s">ภาพเป็นชิ้น base64 + CRC32</text>

    <rect class="box" x="358" y="194" width="200" height="62" rx="8"/>
    <rect x="358" y="194" width="92" height="15" rx="4" fill="#6b4fa0"/><text x="363" y="205" class="tag">สถานีภาคพื้น</text>
    <text x="366" y="226" class="t">โน้ตบุ๊ก + NasaSatLab</text>
    <text x="366" y="244" class="s">สั่งงาน, คาลิเบรต, เก็บหลักฐาน</text>

    <path class="ln" d="M144,225 L164,225"/>
    <path class="ln" d="M336,218 L356,218"/>
    <path class="ln dash" d="M356,236 L338,236"/>
    <text x="300" y="276" class="s">เส้นประ = คำสั่งจากสถานีภาคพื้นไปบอร์ด (SET, M1, M2 ...)</text>
  </g>

  <!-- EPS -->
  <rect class="box" x="580" y="194" width="86" height="62" rx="8"/>
  <rect x="580" y="194" width="34" height="15" rx="4" fill="#666"/><text x="585" y="205" class="tag">EPS</text>
  <text x="588" y="226" class="t">USB 5 V</text>
  <text x="588" y="244" class="s">~0.5 A รวม</text>
  <text x="14" y="300" class="s">กล่อง OBC ทั้งหมดทำงานบน ESP32-S3 ตัวเดียว (firmware NasaSat)</text>
  <text x="14" y="318" class="s">ADCS = กำหนดและควบคุมการวางตัว · OBC = คอมพิวเตอร์บนดาวเทียม · EPS = ระบบพลังงาน · COMM = สื่อสาร</text>
</svg>
